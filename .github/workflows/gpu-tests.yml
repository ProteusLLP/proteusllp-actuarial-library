name: GPU tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Do not run untrusted fork code on a billable GPU runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proteus-gpu
    timeout-minutes: 60
    env:
      PAL_USE_GPU: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure CuPy kernel cache
        run: echo "CUPY_CACHE_DIR=$RUNNER_TEMP/cupy-kernel-cache" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test,gpu,parquet]" "cupy-cuda12x[ctk]"

      - name: Determine CuPy kernel-cache compatibility
        id: cupy-cache-compatibility
        run: |
          python - <<'PY'
          import os
          import sys

          import cupy

          properties = cupy.cuda.runtime.getDeviceProperties(0)
          compatibility = (
              f"py{sys.version_info.major}{sys.version_info.minor}-"
              f"cupy{cupy.__version__}-"
              f"cuda{cupy.cuda.runtime.runtimeGetVersion()}-"
              f"sm{properties['major']}{properties['minor']}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"stack={compatibility}", file=output)
          PY

      - name: Cache CuPy kernels
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cupy-kernel-cache
          key: cupy-kernels-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cupy-cache-compatibility.outputs.stack }}-${{ hashFiles('src/pal/**/*.py', 'tests/**/*.py', 'docs/**/*.md', 'pyproject.toml') }}
          restore-keys: |
            cupy-kernels-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cupy-cache-compatibility.outputs.stack }}-

      - name: Verify GPU acceleration
        run: |
          nvidia-smi
          python - <<'PY'
          import cupy
          import numpy
          from pal import set_random_seed
          from pal._maths import xp
          from pal.config import config
          from pal.distributions import Normal

          if xp is not cupy:
              raise RuntimeError("PAL did not select the CuPy backend")

          device_count = cupy.cuda.runtime.getDeviceCount()
          if device_count < 1:
              raise RuntimeError("CuPy did not detect a CUDA device")

          set_random_seed(123456789)
          if not type(config.rng).__module__.startswith("cupy"):
              raise RuntimeError("PAL did not configure a CuPy random generator")

          device = cupy.cuda.Device()
          properties = cupy.cuda.runtime.getDeviceProperties(device.id)
          device_name = properties["name"]
          if isinstance(device_name, bytes):
              device_name = device_name.decode()

          samples = Normal(0, 1).generate(1024)
          if not isinstance(samples.values, cupy.ndarray):
              raise RuntimeError("PAL generated stochastic samples on the host")

          transformed = numpy.exp(samples) + numpy.square(samples)
          if not isinstance(transformed.values, cupy.ndarray):
              raise RuntimeError("NumPy operations did not dispatch back to CuPy")

          result = cupy.sum(transformed.values)
          device.synchronize()

          print(f"CUDA devices: {device_count}")
          print(f"Active device: {device_name}")
          print(f"CuPy version: {cupy.__version__}")
          print(f"GPU smoke-test result: {float(result)}")
          PY

      - name: Run tests with GPU acceleration
        run: pytest -v --cov=pal --cov-report=term --codeblocks

      - name: Check out PAL-based research examples
        uses: actions/checkout@v7
        with:
          repository: ProteusLLP/proteus-research
          ref: checks/pal-examples-v040
          path: pal-research

      - name: Run ODP research examples with MC and RQMC on GPU
        env:
          PYTHONPATH: ${{ github.workspace }}/pal-research
        run: |
          python -m pytest -q pal-research/tests/test_pal_research_examples.py

      - name: Compare MC and RQMC on GPU
        run: |
          python -m benchmarks.benchmark_sampling --sizes 1024,4096 --replicates 4 \
            --output "$RUNNER_TEMP/pal-sampling-gpu.json" \
            --summary "$RUNNER_TEMP/pal-sampling-gpu.md"
          cat "$RUNNER_TEMP/pal-sampling-gpu.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Profile large GPU Sobol blocks and Poisson inverse
        run: |
          python -m benchmarks.benchmark_qmc_scaling --sizes 131072,1048576 \
            --output "$RUNNER_TEMP/pal-qmc-scaling-gpu.json"
          cat "$RUNNER_TEMP/pal-qmc-scaling-gpu.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark frequency-severity on GPU
        run: |
          python -m benchmarks.benchmark_frequency_severity --sizes 2048,8192 --replicates 2 \
            --output "$RUNNER_TEMP/pal-freqsev-gpu.json" \
            --summary "$RUNNER_TEMP/pal-freqsev-gpu.md"
          cat "$RUNNER_TEMP/pal-freqsev-gpu.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pal-sampling-comparison-gpu
          path: |
            ${{ runner.temp }}/pal-sampling-gpu.*
            ${{ runner.temp }}/pal-qmc-scaling-gpu.json
            ${{ runner.temp }}/pal-freqsev-gpu.*
          if-no-files-found: ignore
          retention-days: 30
