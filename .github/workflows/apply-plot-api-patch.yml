name: Apply plotting API patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/plot-api-docs-svg

      - name: Reconstruct and apply patch
        run: |
          cat \
            .tmp/plot_patch_00.b64 \
            .tmp/plot_patch_01.b64 \
            .tmp/plot_patch_02a.b64 \
            .tmp/plot_patch_02b.b64 \
            .tmp/plot_patch_02c.b64 \
            .tmp/plot_patch_03a.b64 \
            .tmp/plot_patch_03b.b64 \
            .tmp/plot_patch_03c.b64 \
            .tmp/plot_patch_04.b64 \
            .tmp/plot_patch_05.b64 \
            .tmp/plot_patch_06.b64 \
            | base64 --decode > /tmp/plot-api-docs-svg.patch
          echo "b46417f948ddb2fc7cb08bba9f5791154b56368afc50f111d6b53d94512de42a  /tmp/plot-api-docs-svg.patch" | sha256sum --check -
          git apply --check /tmp/plot-api-docs-svg.patch
          git apply /tmp/plot-api-docs-svg.patch

      - name: Remove staging machinery
        run: |
          rm -rf .tmp
          rm .github/workflows/apply-plot-api-patch.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename plotting API and render SVG tutorial plots"
          git push origin HEAD:feature/plot-api-docs-svg
