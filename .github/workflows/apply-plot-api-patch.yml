name: Apply plotting API patch

on:
  push:
    branches:
      - feature/plot-api-docs-svg

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/plot-api-docs-svg

      - name: Reconstruct and apply patch
        run: |
          cat .tmp/plot_patch_*.b64 | base64 --decode > /tmp/plot-api-docs-svg.patch
          git apply --check /tmp/plot-api-docs-svg.patch
          git apply /tmp/plot-api-docs-svg.patch

      - name: Remove staging machinery
        run: |
          rm -rf .tmp
          rm .github/workflows/apply-plot-api-patch.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename plotting API and render SVG tutorial plots"
          git push origin HEAD:feature/plot-api-docs-svg
