name: Docstring coverage

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check syntax in every library module
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          errors = []
          for p in sorted(Path("src/pal").rglob("*.py")):
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              except SyntaxError as exc:
                  errors.append(f"{p}:{exc.lineno}: {exc.msg}: {exc.text}")
          print("\n".join(errors))
          raise SystemExit(bool(errors))
          PY
      - name: Audit argument and attribute documentation
        run: |
          make docstrings
      - name: Install lint and test dependencies
        run: pip install ruff pytest
      - name: Test documentation auditor
        run: python -m pytest -q tests/test_docstring_audit.py
      - name: Lint library and documentation checks
        run: |
          ruff check src/pal tests/test_docstring_audit.py scripts/check_docstrings.py
          ruff format --check src/pal tests/test_docstring_audit.py scripts/check_docstrings.py
