name: Docstring coverage

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check syntax in every library module
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          errors = []
          for p in sorted(Path("src/pal").rglob("*.py")):
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              except SyntaxError as exc:
                  errors.append(f"{p}:{exc.lineno}: {exc.msg}: {exc.text}")
          print("\n".join(errors))
          raise SystemExit(bool(errors))
          PY
      - name: Verify documentation-only changes
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/complete-api-docstrings'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path
          def code(source):
              tree = ast.parse(source, type_comments=True)
              tree.type_ignores = []  # Ignore line-number shifts in existing type-ignore comments.
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if ast.get_docstring(node, clean=False) is not None:
                          node.body.pop(0)
              return ast.dump(tree, include_attributes=False)
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD", "--", "src/pal"],
              text=True,
          ).splitlines()
          differences = []
          for name in changed:
              if not name.endswith(".py"):
                  continue
              before = subprocess.check_output(["git", "show", f'{os.environ["BASE_SHA"]}:{name}'], text=True)
              after = Path(name).read_text(encoding="utf-8")
              if code(before) != code(after):
                  differences.append(name)
          print("Non-docstring changes:", differences)
          raise SystemExit(bool(differences))
          PY
      - name: Audit argument and attribute documentation
        run: |
          python scripts/check_docstrings.py --inventory
          python scripts/check_docstrings.py
      - name: Install lint and test dependencies
        run: pip install ruff pytest
      - name: Test documentation auditor
        run: python -m pytest -q tests/test_docstring_audit.py
      - name: Lint library and documentation checks
        run: |
          ruff check src/pal tests/test_docstring_audit.py scripts/check_docstrings.py
          ruff format --check src/pal tests/test_docstring_audit.py scripts/check_docstrings.py
