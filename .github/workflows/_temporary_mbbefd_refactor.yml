name: Temporary MBBEFD refactor

on:
  push:
    branches:
      - fix/mbbefd-mathematical-docstring

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mbbefd-mathematical-docstring
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Move MBBEFD mean into canonical class
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pal/distributions.py')
          text = path.read_text()
          anchor = '''        result = xp.where(values <= 0, 0.0, xp.where(values >= 1, 1.0, interior))\n        return self._wrap_result(result, x)\n\n\nclass LogLogistic(DistributionBase):'''
          replacement = '''        result = xp.where(values <= 0, 0.0, xp.where(values >= 1, 1.0, interior))\n        return self._wrap_result(result, x)\n\n    def mean(self) -> ReturnType:\n        r\"\"\"Return the expected damage ratio :math:`E[X]`.\n\n        For the main parameter region,\n\n        .. math::\n\n            E[X] = \\frac{(1-b)\\log(gb)}{(1-gb)\\log(b)}.\n\n        The corresponding continuous limits are used for ``b=1`` and\n        ``gb=1``. The degenerate boundary ``g=1`` or ``b=0`` has mean one.\n        \"\"\"\n        g, b = self._validated_params()\n        degenerate = (g == 1) | (b == 0)\n        b_one = xp.isclose(b, 1, rtol=TOLERANCE, atol=TOLERANCE)\n        bg_one = xp.isclose(b * g, 1, rtol=TOLERANCE, atol=TOLERANCE)\n\n        safe_g = xp.where(degenerate, 2.0, g)\n        safe_b = xp.where(degenerate | b_one | bg_one, 2.0, b)\n        limit_g = xp.where(degenerate, 2.0, g)\n        limit_b = xp.where(degenerate | b_one, 0.5, b)\n\n        with np.errstate(divide=\"ignore\", invalid=\"ignore\", over=\"ignore\"):\n            main = (1 - safe_b) * xp.log(safe_g * safe_b) / ((1 - safe_g * safe_b) * xp.log(safe_b))\n            b_limit = xp.log(limit_g) / (limit_g - 1)\n            bg_limit = (1 - limit_b) / (-xp.log(limit_b))\n\n        result = xp.where(\n            degenerate,\n            1.0,\n            xp.where(b_one, b_limit, xp.where(bg_one, bg_limit, main)),\n        )\n        return self._wrap_result(result, 0.0)\n\n\nclass LogLogistic(DistributionBase):'''
          if anchor not in text:
              raise SystemExit('MBBEFD insertion anchor not found')
          path.write_text(text.replace(anchor, replacement, 1))

          Path('src/pal/mbbefd.py').unlink()
          Path('.github/workflows/_temporary_mbbefd_refactor.yml').unlink()
          PY
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Consolidate MBBEFD implementation"
          git push origin HEAD:fix/mbbefd-mathematical-docstring
