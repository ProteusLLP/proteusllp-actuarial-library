# CI/CD pipeline for Proteus Actuarial Library
#
# This workflow runs tests and builds the package.
#
# Triggers:
# - Push/PR: Runs tests and static analysis for code validation
# - GitHub Release: Runs full pipeline (test → build → publish to PyPI)
#
# Jobs:
# - static-analysis: Runs linting/type checking on Python 3.13
# - test: Runs pytest with coverage on Python 3.11 through 3.15 (matrix)
# - docs-math: Builds the documentation, tests documentation code blocks, and validates rendered mathematics
# - build: Builds Python packages using standard build tool
# - pypi-publish: Publishes to PyPI using trusted publishing (release only)
#
# To release: Create a GitHub Release, which triggers automatic PyPI publishing.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,test]"

      - name: Run static analysis
        run: make static-analysis

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest -v --cov=pal --cov-report=xml --cov-report=term --codeblocks

      # Validate example scripts can compile without running them
      # This checks syntax and import resolution without starting Flask servers
      # or other services that would complicate CI testing
      - name: Check examples compile
        run: python -m compileall examples/ -f

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false

  docs-math:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install documentation dependencies
        run: pip install -e ".[docs,test]"

      - name: Test documentation code blocks
        run: pytest docs --codeblocks -q

      - name: Install Chrome for Plotly static export
        run: plotly_get_chrome -y

      - name: Validate math directive structure
        run: python scripts/check_rst_math.py src docs

      - name: Build documentation
        run: sphinx-build -E -b html docs/source docs/build/html

      - name: Install MathJax 4
        run: npm install --no-save --no-package-lock @mathjax/src@4

      - name: Validate rendered mathematics
        run: node scripts/check_sphinx_math.mjs docs/build/html

  build:
    runs-on: ubuntu-latest
    needs: test
    # Always build package to ensure build process works

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full git history for version determination
          fetch-depth: 0
          # For release events, checkout the release tag explicitly
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build setuptools-scm

      - name: Build main package
        run: python -m build

      - name: Build mirror package (proteus-actuarial-library)
        # Build the legacy mirror package for backward compatibility
        # This package re-exports all functionality from proteusllp-actuarial-library
        run: |
          cd mirror-package
          python -m build
          cd ..
          # Copy mirror package distributions to main dist directory
          cp mirror-package/dist/* dist/

      - name: List built distributions
        run: ls -lh dist/

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          # Extract version from release tag (remove 'v' prefix if present)
          RELEASE_VERSION="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          echo "Release tag version: $RELEASE_VERSION"
          
          # Check if built package matches release version
          if ! ls dist/*-${RELEASE_VERSION}-*.whl 2>/dev/null; then
            echo "ERROR: Built package version does not match release tag!"
            echo "Expected version: $RELEASE_VERSION"
            echo "Built packages:"
            ls -1 dist/*.whl
            exit 1
          fi
          echo "✓ Package version matches release tag"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
        # Only upload artifacts on releases to save storage
        if: github.event_name == 'release'

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build
    # Only publish to PyPI using trusted publishing (release only)
    if: github.event_name == 'release'
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
