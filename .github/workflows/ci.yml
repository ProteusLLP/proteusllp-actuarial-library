# CI/CD pipeline for Proteus Actuarial Library
#
# This workflow runs tests and builds the package.
#
# Triggers:
# - Push/PR: Runs tests and static analysis for code validation
# - GitHub Release: Gates publishing on tests, static analysis and docs, then builds and publishes to PyPI
#
# Jobs:
# - static-analysis: Runs linting/type checking on Python 3.13
# - test: Runs pytest with coverage on Python 3.9 through 3.15 (matrix)
# - docs-math: Builds the documentation and validates rendered mathematics
# - build: Builds Python packages using standard build tool
# - pypi-publish: Publishes to PyPI using trusted publishing (release only)
#
# To release: Create a GitHub Release, which triggers automatic PyPI publishing.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,test]"

      - name: Run static analysis
        run: make static-analysis

  test:
    # Python 3.9 is not provisioned on ubuntu-latest (Ubuntu 26.04).
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[test]"

      # Pandas 2.x's Arrow extension registration conflicts with some newer
      # pyarrow builds on Python 3.10; validate Parquet with the compatible line.
      - name: Install compatible Parquet engine (Python 3.10)
        if: matrix.python-version == '3.10'
        run: pip install "pyarrow>=14,<21"

      - name: Install Parquet engine (Python 3.13)
        if: matrix.python-version == '3.13'
        run: pip install -e ".[parquet]"

      - name: Run tests
        run: |
          pytest -v --cov=pal --cov-report=xml --cov-report=term --codeblocks

      # Validate example scripts can compile without running them
      # This checks syntax and import resolution without starting Flask servers
      # or other services that would complicate CI testing
      - name: Check examples compile
        run: python -m compileall examples/ -f

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false

  docs-math:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install documentation dependencies
        run: pip install -e ".[docs]"

      - name: Install Chrome for Plotly static export
        run: plotly_get_chrome -y

      - name: Verify static RQMC SVG figure export
        run: |
          python -m examples.example_qmc_vs_mc --output "$RUNNER_TEMP/qmc-static" --replicates 2
          test -s "$RUNNER_TEMP/qmc-static/qmc_univariate_cdf.svg"
          test -s "$RUNNER_TEMP/qmc-static/qmc_copula_surface.svg"
          test -s "$RUNNER_TEMP/qmc-static/qmc_vs_mc_convergence.svg"

      - name: Validate math directive structure
        run: python scripts/check_rst_math.py src docs

      - name: Build documentation
        run: sphinx-build -E -b html docs/source docs/build/html

      - name: Install MathJax 4
        run: npm install --no-save --no-package-lock @mathjax/src@4

      - name: Validate rendered mathematics
        run: node scripts/check_sphinx_math.mjs docs/build/html

  build:
    runs-on: ubuntu-latest
    needs: [test, static-analysis, docs-math]
    # Do not build or publish a release until all mandatory quality gates pass

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full git history for version determination
          fetch-depth: 0
          # For release events, checkout the release tag explicitly
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build setuptools-scm twine

      - name: Build main package
        run: python -m build

      - name: Build mirror package (proteus-actuarial-library)
        # Build the legacy mirror package for backward compatibility
        # This package re-exports all functionality from proteusllp-actuarial-library
        run: |
          cd mirror-package
          python -m build
          cd ..
          # Copy mirror package distributions to main dist directory
          cp mirror-package/dist/* dist/

      - name: List built distributions
        run: ls -lh dist/

      - name: Check distributions and installed wheel imports
        run: |
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/pal-wheel-smoke"
          "$RUNNER_TEMP/pal-wheel-smoke/bin/python" -m pip install dist/proteusllp_actuarial_library-*.whl
          "$RUNNER_TEMP/pal-wheel-smoke/bin/python" -m pip install --no-deps dist/proteus_actuarial_library-*.whl
          "$RUNNER_TEMP/pal-wheel-smoke/bin/python" - <<'PY'
          import pal
          import proteus
          from pal import api
          from pal.correlation import nearest_correlation, complete_corr, cluster_corr
          from pal.distributions import Gamma
          from pal.model_averaging import WeightedDistribution
          from pal.serialization import load, save

          assert callable(api.recipes)
          print("Primary and mirror wheels import successfully.")
          PY

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          # Extract version from release tag (remove 'v' prefix if present)
          RELEASE_VERSION="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          echo "Release tag version: $RELEASE_VERSION"
          
          # Both the primary and the compatibility mirror must match the release tag.
          for PACKAGE in proteusllp_actuarial_library proteus_actuarial_library; do
            if ! ls "dist/${PACKAGE}-${RELEASE_VERSION}-"*.whl >/dev/null 2>&1; then
              echo "ERROR: Missing ${PACKAGE} wheel for release ${RELEASE_VERSION}"
              echo "Built packages:"
              ls -1 dist/*.whl
              exit 1
            fi
          done
          echo "Both package versions match the release tag"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
        # Only upload artifacts on releases to save storage
        if: github.event_name == 'release'

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build
    # Only publish to PyPI when a GitHub Release is created
    if: github.event_name == 'release'
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
