name: Performance benchmarks

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated simulation counts"
        type: string
        default: "10000,100000"
      run_gpu:
        description: "Also benchmark on the dedicated GPU runner"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/performance.yml"
      - "src/pal/frequency_severity.py"
      - "src/pal/couplings.py"
      - "src/pal/copulas.py"
      - "src/pal/distributions.py"
      - "src/pal/_mean_excess.py"
      - "src/pal/fitting.py"
      - "src/pal/fitting_remaining.py"
      - "src/pal/_severity_probability.py"

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PAL
        run: pip install -e .
      - name: Check mean excess accuracy
        run: |
          pip install mpmath
          python -m benchmarks.check_mean_excess_accuracy | tee "$RUNNER_TEMP/pal-mean-excess-accuracy.json"
      - name: Benchmark mean excess
        run: |
          python -m benchmarks.benchmark_mean_excess \
            --output "$RUNNER_TEMP/pal-mean-excess.json"
          cat "$RUNNER_TEMP/pal-mean-excess.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark CPU
        env:
          BENCH_SIZES: ${{ inputs.sizes || '10000,100000' }}
        run: |
          python -m benchmarks.benchmark_core --sizes "$BENCH_SIZES" \
            --output "$RUNNER_TEMP/pal-cpu.json" --summary "$RUNNER_TEMP/pal-cpu.md"
      - name: Profile CPU memory
        run: |
          python -m benchmarks.profile_memory \
            --cases aggregate,occurrence,compound_generation,xol_layer,end_to_end,portfolio \
            --sizes 10000,100000 \
            --output "$RUNNER_TEMP/pal-memory-cpu.json" \
            --summary "$RUNNER_TEMP/pal-memory-cpu.md"
      - name: Publish CPU benchmark summary
        if: always()
        run: |
          for report in "$RUNNER_TEMP/pal-cpu.md" "$RUNNER_TEMP/pal-memory-cpu.md"; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pal-performance-cpu
          path: |
            ${{ runner.temp }}/pal-cpu.*
            ${{ runner.temp }}/pal-memory-cpu.*
            ${{ runner.temp }}/pal-mean-excess*.json
          retention-days: 30

  fitting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PAL
        run: pip install -e .
      - name: Compare fitting optimizers
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m benchmarks.benchmark_fitting --size 10000 \
            --output "$RUNNER_TEMP/pal-fitting.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pal-fitting-optimizers
          path: ${{ runner.temp }}/pal-fitting.json
          retention-days: 30

  variable-io:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PAL and PyArrow
        run: pip install -e ".[parquet]"
      - name: Benchmark columnar and legacy variable I/O
        run: |
          python -m benchmarks.benchmark_variable_io \
            --simulations 20000 --variables 20 \
            --output "$RUNNER_TEMP/pal-variable-io.json"
          python -m benchmarks.benchmark_variable_io \
            --simulations 100000 --variables 100 --compact-only \
            --output "$RUNNER_TEMP/pal-variable-io-large.json"
          for report in "$RUNNER_TEMP"/pal-variable-io*.json; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pal-performance-variable-io
          path: ${{ runner.temp }}/pal-variable-io*.json
          retention-days: 30

  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu && github.ref == 'refs/heads/main'
    runs-on: proteus-gpu
    timeout-minutes: 35
    env:
      PAL_USE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PAL and CuPy
        run: pip install -e ".[gpu]" "cupy-cuda12x[ctk]"
      - name: Benchmark GPU
        env:
          BENCH_SIZES: ${{ inputs.sizes || '10000,100000' }}
        run: |
          nvidia-smi
          python -m benchmarks.benchmark_core --sizes "$BENCH_SIZES" \
            --output "$RUNNER_TEMP/pal-gpu.json" --summary "$RUNNER_TEMP/pal-gpu.md"
      - name: Profile GPU memory
        run: |
          python -m benchmarks.profile_memory \
            --cases aggregate,occurrence,compound_generation,xol_layer,end_to_end,portfolio \
            --sizes 10000,100000 \
            --output "$RUNNER_TEMP/pal-memory-gpu.json" \
            --summary "$RUNNER_TEMP/pal-memory-gpu.md"
      - name: Publish GPU benchmark summary
        if: always()
        run: |
          for report in "$RUNNER_TEMP/pal-gpu.md" "$RUNNER_TEMP/pal-memory-gpu.md"; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pal-performance-gpu
          path: |
            ${{ runner.temp }}/pal-gpu.*
            ${{ runner.temp }}/pal-memory-gpu.*
          retention-days: 30
